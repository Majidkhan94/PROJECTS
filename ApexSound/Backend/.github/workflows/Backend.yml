name: Apexsound_Backend
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.0'
    
    - name: Restore dependencies
      run: dotnet restore ApexSound-BackEnd/ApexSound-BackEnd.csproj
    
    - name: Build
      run: dotnet build ApexSound-BackEnd/ApexSound-BackEnd.csproj --no-restore --configuration Release