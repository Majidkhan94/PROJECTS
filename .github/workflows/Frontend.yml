name: Apexsound_Frontend
on:
  push:
    branches: ["main"]
    paths:
      - 'ApexSound/Frontend/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'ApexSound/Frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApexSound/Frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ApexSound/Frontend
        push: true
        tags: |
          majidkhan05/apexsound_frontend:latest
          majidkhan05/apexsound_frontend:${{ github.sha }}